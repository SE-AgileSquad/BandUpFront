name: CD

# Builds and pushes the frontend image, then deploys over SSH. Only runs after CI's
# build-and-lint job has passed on main or develop, so a red build never reaches a server.

on:
  workflow_run:
    workflows: [CI]
    branches: [main, develop]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: tags
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "image=${{ env.IMAGE }}:$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_branch }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ needs.build-and-push.outputs.image }}
            docker stop bandup-frontend 2>/dev/null || true
            docker rm bandup-frontend 2>/dev/null || true
            docker run -d --name bandup-frontend --restart unless-stopped --network bandup-prod_backend \
              ${{ needs.build-and-push.outputs.image }}
